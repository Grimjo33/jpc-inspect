<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPC Inspect</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}.loading{height:100%;display:grid;place-items:center}.shell{height:100%}.shell[hidden],.loading[hidden]{display:none}.app{border:0;width:100%;height:100%}.logout{position:fixed;right:18px;bottom:18px;z-index:4;padding:9px 13px;border:1px solid #ddd;border-radius:8px;background:#fff;font-weight:700}</style></head><body><div class="loading" id="loading">Memeriksa sesi...</div><main class="shell" id="shell" hidden><iframe class="app" src="/v3.html"></iframe><button class="logout" id="logout">Keluar</button></main><script type="module">import{getCurrentUser,signOut}from'./data/supabase.js';const u=await getCurrentUser();if(!u)location.replace('/login.html');else{loading.hidden=true;shell.hidden=false}logout.onclick=async()=>{await signOut();location.replace('/login.html')}</script><script>document.querySelector('.app').addEventListener('load',e=>{let d=e.target.contentDocument,w=e.target.contentWindow;for(const href of ['/workflow-polish.css','/report-premium.css','/app-final.css']){let l=d.createElement('link');l.rel='stylesheet';l.href=href;d.head.append(l)}const nativeShow=w.HTMLDialogElement.prototype.showModal;w.HTMLDialogElement.prototype.showModal=function(){if(!this.open)return nativeShow.call(this)};const guard=new MutationObserver(()=>d.querySelectorAll('.badge-ok:not([data-sign])').forEach(x=>x.setAttribute('data-sign','signed')));guard.observe(d.body,{childList:true,subtree:true});const scripts=['/data/workflow-v2.js','/data/workflow-feedback-v2.js','/data/report-workflow-v2.js','/data/app-final.js','/data/integrated-flow.js','/data/ui-final-polish.js','/data/report-action-sync.js','/data/role-assignment.js','/data/team-admin.js'];const next=i=>{if(i>=scripts.length)return;let s=d.createElement('script');s.type='module';s.src=scripts[i];s.onload=()=>next(i+1);d.body.append(s)};next(0)})</script></body></html>
