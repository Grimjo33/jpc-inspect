<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPC Inspect</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}.loading{height:100%;display:grid;place-items:center}.shell{height:100%}.shell[hidden],.loading[hidden]{display:none}.app{border:0;width:100%;height:100%}.logout{position:fixed;right:18px;bottom:18px;z-index:4;padding:9px 13px;border:1px solid #ddd;border-radius:8px;background:#fff;font-weight:700}</style></head><body><div class="loading" id="loading">Memeriksa sesi...</div><main class="shell" id="shell" hidden><iframe class="app" src="/v3.html"></iframe><button class="logout" id="logout">Keluar</button></main><script type="module">import{getCurrentUser,signOut}from'./data/supabase.js';const u=await getCurrentUser();if(!u)location.replace('/login.html');else{loading.hidden=true;shell.hidden=false}logout.onclick=async()=>{await signOut();location.replace('/login.html')}</script><script>document.querySelector('.app').addEventListener('load',e=>{let d=e.target.contentDocument,l=d.createElement('link');l.rel='stylesheet';l.href='/workflow-polish.css';d.head.append(l);const guard=new MutationObserver(()=>d.querySelectorAll('.badge-ok:not([data-sign])').forEach(x=>x.setAttribute('data-sign','signed')));guard.observe(d.body,{childList:true,subtree:true});let s=d.createElement('script');s.type='module';s.src='/data/workflow-v2.js';s.onload=()=>{let o=d.querySelector('#estage option[value="closure"]');if(o)o.value='closing';let f=d.createElement('script');f.type='module';f.src='/data/workflow-feedback-v2.js';d.body.append(f)};d.body.append(s)})</script></body></html>
