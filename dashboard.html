<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JPC Inspect</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,system-ui,sans-serif;background:#f6f7f9}.loading{height:100%;display:grid;place-items:center;color:#68717c}.shell{height:100%;position:relative}.shell[hidden],.loading[hidden]{display:none}.app{border:0;width:100%;height:100%;display:block}.logout{position:fixed;right:18px;bottom:18px;z-index:4;border:1px solid #d9dee4;background:#fff;color:#2c3137;border-radius:8px;padding:9px 13px;font-weight:700;box-shadow:0 4px 16px rgba(0,0,0,.12);cursor:pointer}@media(max-width:760px){.logout{right:12px;bottom:12px}}</style></head><body><div class="loading" id="loading">Memeriksa sesi...</div><main class="shell" id="shell" hidden><iframe class="app" src="/v3.html" title="JPC Inspect"></iframe><button class="logout" id="logout">Keluar</button></main><script type="module">import{getCurrentUser,signOut}from'./data/supabase.js';const user=await getCurrentUser();if(!user)location.replace('/login.html');else{document.querySelector('#loading').hidden=true;document.querySelector('#shell').hidden=false}document.querySelector('#logout').addEventListener('click',async()=>{await signOut();location.replace('/login.html')});</script></body></html>
